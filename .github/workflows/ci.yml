name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check . --output-format=github
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -q

  postgres:
    name: PostgreSQL migrations & seed
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: enterprise
          POSTGRES_PASSWORD: enterprise
          POSTGRES_DB: enterprise_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enterprise -d enterprise_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://enterprise:enterprise@localhost:5432/enterprise_api
      ENVIRONMENT: testing
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789abcdef
      AUTO_CREATE_TABLES: "false"
      RATE_LIMIT_ENABLED: "false"
      TRUSTED_HOSTS: "*"
      BCRYPT_ROUNDS: "4"
      SEED_PASSWORD: DemoPassw0rd!
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project with PostgreSQL driver
        run: pip install -e ".[dev,postgres]"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Verify migrations are reversible
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Seed demo data twice (idempotency)
        run: |
          python -m scripts.seed
          python -m scripts.seed
      - name: Smoke-test the running service
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health/ready && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health/live
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ada@example.com","password":"DemoPassw0rd!"}' > /dev/null

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: enterprise-api-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
