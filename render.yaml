services:
    - type: web
    name: enterprise-api-backend
    env: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
            - key: ENVIRONMENT
        value: production
            - key: DEBUG
        value: false
            - key: LOG_LEVEL
        value: INFO
            - key: DOCS_ENABLED
        value: true
            - key: JWT_ALGORITHM
        value: HS256
            - key: DATABASE_URL
        fromDatabase:
          name: enterprise-db
          property: connectionString
            - key: SECRET_KEY
        generateValue: true

databases:
    - name: enterprise-db
    plan: free
    databaseName: enterprise_db
    user: enterprise_user
