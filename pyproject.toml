[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-api-backend"
version = "1.0.0"
description = "Enterprise-grade FastAPI backend: JWT auth, Projects & Tasks, PDF reports, PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shoaib" }]
keywords = ["fastapi", "jwt", "sqlalchemy", "postgresql", "rest-api", "pdf"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "aiosqlite>=0.20,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "email-validator>=2.1,<3.0",
    "pyjwt>=2.8,<3.0",
    "bcrypt>=4.1,<6.0",
    "python-multipart>=0.0.9,<1.0",
    "alembic>=1.13,<2.0",
    "reportlab>=4.1,<6.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29,<1.0"]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<2.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
]

[project.urls]
Homepage = "https://github.com/your-org/enterprise-api-backend"
Documentation = "https://github.com/your-org/enterprise-api-backend/blob/main/docs/API.md"
Repository = "https://github.com/your-org/enterprise-api-backend"
Issues = "https://github.com/your-org/enterprise-api-backend/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "C4", "SIM"]
ignore = ["B008"]  # FastAPI dependency injection relies on call expressions as defaults

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.format]
quote-style = "double"
